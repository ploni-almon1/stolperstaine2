<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stolpersteine Mapa</title>

  <!-- Odstraněny restriktivní SRI hashe pro bezproblémové načtení -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="app-header">
    <h1>🪨 Stolpersteine</h1>
    <div class="controls">
      <label class="switch">
        <!-- Zde jsem smazal slovo "checked" -->
        <input type="checkbox" id="toggle-cleaning" />
        <span>Stav čištění</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-grayscale" />
        <span>Černobílá</span>
      </label>
    </div>
  </header>

  <div id="map"></div>

  <aside id="detail-panel">
    <button id="close-detail">✕</button>
    <img id="detail-photo" src="" alt="Fotografie kamene" />
    <h2 id="detail-name"></h2>
    <p id="detail-address"></p>
    <p id="detail-bio"></p>
    <p id="detail-cleaned"></p>

    <form id="cleaning-form">
      <h3>Zaznamenat čištění</h3>
      <div class="form-row">
        <label for="cleaning-date">Datum:</label>
        <input type="date" id="cleaning-date" required max="" />
      </div>
      <button type="submit" id="cleaning-submit">Uložit</button>
      <span id="cleaning-feedback" class="feedback hidden"></span>
    </form>

    <a id="detail-link" href="#" target="_blank">Zobrazit plný profil →</a>
  </aside>

  <!-- Odstraněny restriktivní SRI hashe -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
