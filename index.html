<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stolpersteine Mapa</title>

  <!-- Google Fonty (Ubuntu a Open Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Ikony FontAwesome (pro lupu, vrstvy, terč, hamburger) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Náš vlastní styl -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Horní navigační lišta -->
  <header class="top-nav">
    <div class="logo">
      <div class="logo-icon">
        <div class="cube yellow"></div><div class="cube black"></div>
        <div class="cube black"></div><div class="cube yellow"></div>
      </div>
      <h1>Stolpersteine <span class="fw-normal">mapa</span></h1>
    </div>
    
    <!-- Navigace pro PC (skrytá na mobilu) -->
    <nav class="nav-links desktop-only">
      <a href="#">Úvod</a>
      <a href="#" class="active">Mapa</a>
      <a href="#">Seznam</a>
      <a href="#">xyz</a>
    </nav>

    <!-- Tlačítko pro mobilní menu -->
    <button class="hamburger mobile-only" id="hamburger-btn">
      <i class="fas fa-bars"></i>
    </button>
  </header>

  <!-- Mobilní rozbalovací menu (skryté v základu) -->
  <nav class="mobile-menu" id="mobile-menu">
    <a href="#">Úvod</a>
    <a href="#" class="active">Mapa</a>
    <a href="#">Seznam</a>
    <a href="#">xyz</a>
  </nav>

  <!-- Obal pro mapu a její prvky -->
  <div id="map-wrapper">
    <div id="map" class="grayscale-tiles"></div>
    
    <!-- Plovoucí prvky vpravo nahoře -->
    <div class="top-right-controls">
      <button class="icon-btn" title="Hledat (zatím neaktivní)"><i class="fas fa-search"></i></button>
      <button id="btn-stav" class="pill-btn">stav</button>
    </div>
  </div>

  <!-- Boční panel s detaily -->
  <div id="detail-panel" class="panel">
    <button id="close-detail" class="close-btn"><i class="fas fa-times"></i></button>
    <img id="detail-photo" src="" alt="Fotografie kamene">
    <h2 id="detail-name">Jméno</h2>
    <p id="detail-address" class="address">📍 Adresa</p>
    <p id="detail-bio">Zde budou informace o osobě...</p>
    
    <hr>
    
    <div class="cleaning-section">
      <h3>Údržba kamene</h3>
      <p id="detail-cleaned">🧹 Zjišťuji stav...</p>
      
      <form id="cleaning-form">
        <label for="cleaning-date">Zaznamenat nové čištění:</label>
        <input type="date" id="cleaning-date" required>
        <button type="submit" class="save-btn">Uložit online</button>
      </form>
      <div id="cleaning-feedback" class="hidden"></div>
    </div>
    
    <a id="detail-link" href="#" target="_blank" class="more-link">Více informací</a>
  </div>

  <!-- Skripty Leaflet a Firebase -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- Naše data a hlavní skript -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
