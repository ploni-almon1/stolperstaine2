<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stolpersteine Mapa</title>

  <!-- Bezpečné načtení Leafletu a doplňků pomocí SRI -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-KURoM40hzA38Zz9z/06c27XNfU13E+s1w9RZY134yM=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha256-4O2Fz0yO5RMTiR9fQ24i7g86wVjRka/Wp30lEK+R50E=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="app-header">
    <h1>🪨 Stolpersteine</h1>
    <div class="controls">
      <label class="switch">
        <input type="checkbox" id="toggle-cleaning" checked />
        <span>Stav čištění</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-grayscale" />
        <span>Černobílá</span>
      </label>
    </div>
  </header>

  <div id="map"></div>

  <aside id="detail-panel">
    <button id="close-detail">✕</button>
    <img id="detail-photo" src="" alt="Fotografie kamene" />
    <h2 id="detail-name"></h2>
    <p id="detail-address"></p>
    <p id="detail-bio"></p>
    <p id="detail-cleaned"></p>

    <form id="cleaning-form">
      <h3>Zaznamenat čištění</h3>
      <div class="form-row">
        <label for="cleaning-date">Datum:</label>
        <!-- Nativní input pro datum je na mobilu mnohem přívětivější -->
        <input type="date" id="cleaning-date" required max="" />
      </div>
      <button type="submit" id="cleaning-submit">Uložit</button>
      <span id="cleaning-feedback" class="feedback hidden"></span>
    </form>

    <a id="detail-link" href="#" target="_blank">Zobrazit plný profil →</a>
  </aside>

  <!-- Bezpečné načtení skriptů -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-1GzZ//TDZp3GjM6Uu/ZzRb1Q+A0ZzT0yJtV+bQn2s0s=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
